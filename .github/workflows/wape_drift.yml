name: wape-drift-monitor

on:
  workflow_run:
    workflows: ["data-collector"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pulso-wape-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jwlgxabibcticikhjhzf.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WAPE_DRIFT_THRESHOLD: ${{ vars.WAPE_DRIFT_THRESHOLD || '0.05' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Download saved production inputs for PSI monitoring
        run: PYTHONPATH=src python scripts/download_supabase_data.py
      - name: Calculate input feature PSI (diagnostic only)
        run: |
          mkdir -p artifacts
          python scripts/detect_drift.py \
            --threshold 0.20 \
            --window-days 7 \
            --output artifacts/input_drift_report.json
      - name: Compare mature forecast WAPE windows
        id: calculate_drift
        run: |
          mkdir -p artifacts
          python scripts/wape_drift.py check \
            --threshold "$WAPE_DRIFT_THRESHOLD" \
            --output artifacts/wape_drift_report.json
      - name: Find pending drift alert
        id: pending
        run: python scripts/wape_drift.py pending
      - name: Dispatch retraining for pending drift
        if: steps.pending.outputs.drift_pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/retrain_on_drift.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data '{"ref":"main"}'
      - name: Summarize WAPE drift
        if: always()
        run: |
          if [[ -f artifacts/wape_drift_report.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('artifacts/wape_drift_report.json', encoding='utf-8'))
          ref=r['reference_window']; cur=r['current_window']
          print(f"WAPE previo: {ref['wape']} ({ref['samples']} pares)")
          print(f"WAPE reciente: {cur['wape']} ({cur['samples']} pares)")
          print(f"Targets maduros hasta: {r['latest_mature_target_at']}")
          print(f"Cambio relativo: {r['relative_increase']} · Drift: {r['drift_detected']} ({r['reason']})")
          PY
          fi
          if [[ -f artifacts/input_drift_report.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('artifacts/input_drift_report.json', encoding='utf-8'))
          print(f"PSI de entradas: máximo {r['max_psi']} · {r['reason']} · dispara reentrenamiento: no")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wape-drift-report
          path: |
            artifacts/wape_drift_report.json
            artifacts/input_drift_report.json
          if-no-files-found: ignore
