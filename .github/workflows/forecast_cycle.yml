name: forecast-cycle-poller

on:
  schedule:
    - cron: '1-59/5 * * * *'
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Entrena y genera el payload sin enviarlo'
        required: true
        default: false
        type: boolean

jobs:
  poll-and-submit:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'forecast-cycle-dry-run' || 'forecast-cycle-poller' }}
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PULSO_API_URL: ${{ vars.PULSO_API_URL || 'https://pulso-transmi.72-60-245-2.sslip.io' }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      DRIFT_THRESHOLD: ${{ vars.DRIFT_THRESHOLD || '0.20' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[ml]'

      - name: Download current API data
        run: PYTHONPATH=src python scripts/download_api_data.py

      - name: Restore cached model package
        id: model_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/pulso_transmi_best_models
            artifacts/pulso_transmi_best_models.zip
          key: pulso-transmi-model-gap133-${{ github.run_id }}
          restore-keys: |
            pulso-transmi-model-gap133-
            pulso-transmi-model-

      - name: Check restored model package
        id: model_state
        run: |
          bundle=artifacts/pulso_transmi_best_models
          available=true
          [[ -f "$bundle/best_ensemble_summary.csv" ]] || available=false
          for horizon in 15 30 45 60; do
            [[ -f "$bundle/models/horizon_${horizon}_hgb.pkl" ]] || available=false
            [[ -f "$bundle/configs/horizon_${horizon}_ensemble.json" ]] || available=false
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Submit immediately with cached model
        id: fast_submit
        if: env.DRY_RUN != 'true' && steps.model_state.outputs.available == 'true'
        run: |
          PYTHONPATH=src python scripts/infer_and_submit.py \
            --output artifacts/current_submission.json \
            --wait-seconds 90 \
            --poll-seconds 30

      - name: Detect data drift
        id: drift
        if: env.DRY_RUN == 'true' || steps.model_state.outputs.available != 'true'
        run: |
          PYTHONPATH=src python scripts/detect_drift.py \
            --threshold "$DRIFT_THRESHOLD" \
            --output artifacts/drift_report.json
          drift_detected=$(python3 -c "import json; print(str(json.load(open('artifacts/drift_report.json'))['drift_detected']).lower())")
          echo "drift_detected=$drift_detected" >> "$GITHUB_OUTPUT"

      - name: Save previous model for WAPE comparison
        if: env.DRY_RUN == 'true' && steps.model_state.outputs.available == 'true'
        run: |
          rm -rf artifacts/previous_model artifacts/previous_model.zip
          cp -a artifacts/pulso_transmi_best_models artifacts/previous_model
          if [[ -f artifacts/pulso_transmi_best_models.zip ]]; then
            cp -a artifacts/pulso_transmi_best_models.zip artifacts/previous_model.zip
          fi

      - name: Retrain and package after drift
        if: (env.DRY_RUN == 'true' && steps.fast_submit.outputs.submitted != 'true' && (steps.model_state.outputs.available != 'true' || steps.drift.outputs.drift_detected == 'true')) || steps.model_state.outputs.available != 'true'
        run: |
          MLFLOW_DISABLE_AGENT_HINT=1 PYTHONWARNINGS=ignore \
            PYTHONPATH=src python examples/03_gradient_boosting.py
          MLFLOW_DISABLE_AGENT_HINT=1 PYTHONWARNINGS=ignore \
            PYTHONPATH=src python examples/04_package_best_model.py

      - name: Promote only if WAPE improves
        if: env.DRY_RUN == 'true' && steps.fast_submit.outputs.submitted != 'true' && (steps.model_state.outputs.available != 'true' || steps.drift.outputs.drift_detected == 'true')
        run: |
          PYTHONPATH=src python scripts/promote_model.py \
            --candidate artifacts/pulso_transmi_best_models \
            --previous artifacts/previous_model \
            --package artifacts/pulso_transmi_best_models \
            --package-zip artifacts/pulso_transmi_best_models.zip \
            --output artifacts/model_promotion.json

      - name: Cache retrained model package
        if: env.DRY_RUN == 'true' && steps.fast_submit.outputs.submitted != 'true' && (steps.model_state.outputs.available != 'true' || steps.drift.outputs.drift_detected == 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/pulso_transmi_best_models
            artifacts/pulso_transmi_best_models.zip
          key: pulso-transmi-model-gap133-${{ github.run_id }}

      - name: Check whether the cycle is open, generate predictions, and submit
        id: final_submit
        if: steps.fast_submit.outcome == 'skipped' || env.DRY_RUN == 'true'
        run: |
          args=(--output artifacts/current_submission.json)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          args+=(--wait-seconds 90 --poll-seconds 30)
          PYTHONPATH=src python scripts/infer_and_submit.py "${args[@]}"

      - name: Report delivery outcome
        if: always()
        env:
          FAST_SUBMITTED: ${{ steps.fast_submit.outputs.submitted }}
          FAST_SUBMISSION_ID: ${{ steps.fast_submit.outputs.submission_id }}
          FINAL_SUBMITTED: ${{ steps.final_submit.outputs.submitted }}
          FINAL_SUBMISSION_ID: ${{ steps.final_submit.outputs.submission_id }}
          DRY_RUN: ${{ env.DRY_RUN }}
        run: |
          if [[ -f artifacts/current_submission.json ]]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("artifacts/current_submission.json", encoding="utf-8") as payload_file:
              payload = json.load(payload_file)
          print(f"Ciclo: `{payload['cycle_id']}` · Predicciones: {len(payload['predictions'])}")
          PY
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: payload generado sin envío." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$FAST_SUBMITTED" == "true" || "$FINAL_SUBMITTED" == "true" ]]; then
            submission_id="${FAST_SUBMISSION_ID:-$FINAL_SUBMISSION_ID}"
            echo "Entrega oficial confirmada por la API. Submission ID: ${submission_id:-no informado}." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f artifacts/current_submission.json ]]; then
            echo "Se generó payload, pero esta ejecución no confirmó una entrega oficial. Revisa el log de infer_and_submit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se encontró un ciclo abierto en esta ejecución; se volverá a consultar en el siguiente poll." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload generated submission artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-submission
          path: |
            artifacts/current_submission.json
            artifacts/drift_report.json
            artifacts/model_promotion.json
          if-no-files-found: ignore
