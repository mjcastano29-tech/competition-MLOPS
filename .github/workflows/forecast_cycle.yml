name: forecast-cycle-poller

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Entrena y genera el payload sin enviarlo'
        required: true
        default: false
        type: boolean

jobs:
  poll-and-submit:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'forecast-cycle-dry-run' || 'forecast-cycle-poller' }}
      cancel-in-progress: false
    timeout-minutes: 8
    permissions:
      contents: read
      # Permite recuperar el paquete del campeon publicado por el ultimo reentrenamiento
      # cuando el cache del runner llega vacio; sin el, la entrega caeria al bundle viejo.
      actions: read
      # Abre/cierra el issue que avisa que los datos dejaron de ser compatibles con el campeon.
      issues: write
    env:
      PULSO_API_URL: ${{ vars.PULSO_API_URL || 'https://pulso-transmi.72-60-245-2.sslip.io' }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jwlgxabibcticikhjhzf.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . scikit-learn

      - name: Restore cached model package
        id: model_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/pulso_transmi_best_models
            artifacts/pulso_transmi_best_models.zip
          key: pulso-transmi-model-gap133-${{ github.run_id }}
          restore-keys: |
            pulso-transmi-model-gap133-
            pulso-transmi-model-

      - name: Recover the champion package of the last retraining run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle=artifacts/pulso_transmi_best_models
          complete=true
          [[ -f "$bundle/best_ensemble_summary.csv" ]] || complete=false
          for horizon in 15 30 45 60; do
            [[ -f "$bundle/models/horizon_${horizon}_hgb.pkl" ]] || complete=false
            [[ -f "$bundle/configs/horizon_${horizon}_ensemble.json" ]] || complete=false
          done
          if [[ "$complete" == true ]]; then
            echo "El cache traia el paquete del campeon completo."
            exit 0
          fi
          run_id=$(gh run list --workflow retrain_on_drift.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "::warning::No hay reentrenamiento previo del que recuperar el campeon; se usara el bundle del repositorio."
            exit 0
          fi
          if gh run download "$run_id" -n champion-package --dir artifacts; then
            echo "Paquete del campeon recuperado del artefacto del run $run_id."
          else
            echo "::warning::El run $run_id no publico champion-package; se usara el bundle del repositorio."
          fi

      - name: Check restored model package
        id: model_state
        run: |
          bundle=artifacts/pulso_transmi_best_models
          available=true
          [[ -f "$bundle/best_ensemble_summary.csv" ]] || available=false
          for horizon in 15 30 45 60; do
            [[ -f "$bundle/models/horizon_${horizon}_hgb.pkl" ]] || available=false
            [[ -f "$bundle/configs/horizon_${horizon}_ensemble.json" ]] || available=false
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Submit immediately with cached model
        id: fast_submit
        if: env.DRY_RUN != 'true' && steps.model_state.outputs.available == 'true'
        run: |
          PYTHONPATH=src python scripts/infer_and_submit.py \
            --output artifacts/current_submission.json \
            --wait-seconds 0 \
            --poll-seconds 30

      - name: Check whether the cycle is open, generate predictions, and submit
        id: final_submit
        if: steps.fast_submit.outcome == 'skipped' || env.DRY_RUN == 'true'
        run: |
          args=(--output artifacts/current_submission.json)
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          args+=(--wait-seconds 0 --poll-seconds 30)
          PYTHONPATH=src python scripts/infer_and_submit.py "${args[@]}"

      - name: Report delivery outcome
        if: always()
        env:
          FAST_SUBMITTED: ${{ steps.fast_submit.outputs.submitted }}
          FAST_SUBMISSION_ID: ${{ steps.fast_submit.outputs.submission_id }}
          FINAL_SUBMITTED: ${{ steps.final_submit.outputs.submitted }}
          FINAL_SUBMISSION_ID: ${{ steps.final_submit.outputs.submission_id }}
          FAST_MONITORING_PERSISTED: ${{ steps.fast_submit.outputs.monitoring_persisted }}
          FINAL_MONITORING_PERSISTED: ${{ steps.final_submit.outputs.monitoring_persisted }}
          DRY_RUN: ${{ env.DRY_RUN }}
        run: |
          if [[ -f artifacts/current_submission.json ]]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("artifacts/current_submission.json", encoding="utf-8") as payload_file:
              payload = json.load(payload_file)
          print(f"Ciclo: `{payload['cycle_id']}` · Predicciones: {len(payload['predictions'])}")
          PY
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: payload generado sin envío." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$FAST_SUBMITTED" == "true" || "$FINAL_SUBMITTED" == "true" ]]; then
            submission_id="${FAST_SUBMISSION_ID:-$FINAL_SUBMISSION_ID}"
            echo "Entrega oficial confirmada por la API. Submission ID: ${submission_id:-no informado}." >> "$GITHUB_STEP_SUMMARY"
            monitoring_persisted="${FAST_MONITORING_PERSISTED:-$FINAL_MONITORING_PERSISTED}"
            if [[ "$monitoring_persisted" != "true" ]]; then
              echo "Atención: se envió la predicción, pero no se guardó para monitorear WAPE. Revisa SUPABASE_SERVICE_ROLE_KEY y la migración." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ -f artifacts/current_submission.json ]]; then
            echo "Se generó payload, pero esta ejecución no confirmó una entrega oficial. Revisa el log de infer_and_submit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se encontró un ciclo abierto en esta ejecución; se volverá a consultar en el siguiente poll." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Alert when the data stopped being compatible with the champion
        if: always() && (steps.fast_submit.outputs.compatible != '' || steps.final_submit.outputs.compatible != '')
        env:
          GH_TOKEN: ${{ github.token }}
          COMPATIBLE: ${{ steps.fast_submit.outputs.compatible || steps.final_submit.outputs.compatible }}
          FALLBACK: ${{ steps.fast_submit.outputs.fallback_targets || steps.final_submit.outputs.fallback_targets }}
          TOTAL: ${{ steps.fast_submit.outputs.total_targets || steps.final_submit.outputs.total_targets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=modelo-incompatible
          open_issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [[ "$COMPATIBLE" == "true" ]]; then
            echo "Datos compatibles con el campeon: ${TOTAL} targets con el modelo." >> "$GITHUB_STEP_SUMMARY"
            if [[ -n "$open_issue" ]]; then
              gh issue close "$open_issue" --repo "$GITHUB_REPOSITORY" \
                --comment "Compatibilidad restaurada: el ciclo de $RUN_URL uso el campeon en los ${TOTAL} targets."
            fi
            exit 0
          fi
          echo "::warning::Datos incompatibles con el campeon: ${FALLBACK}/${TOTAL} targets salieron por el respaldo."
          reasons=$(python3 -c "import json; r=json.load(open('artifacts/compatibility_report.json')); print(chr(10).join('- ' + x for x in r['reasons']) or '- sin detalle'); print(); print('Fuentes: ' + json.dumps(r['sources'], ensure_ascii=False))" 2>/dev/null || echo "- ver el artefacto compatibility-report")
          {
            echo "**Datos incompatibles con el campeon.** ${FALLBACK} de ${TOTAL} targets salieron por el respaldo (la racha sigue)."
            echo
            echo "$reasons"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$open_issue" ]]; then
            echo "Ya hay un issue abierto (#$open_issue); no se duplica la alerta."
            exit 0
          fi
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --color d73a4a \
            --description "Los datos del reto dejaron de ser compatibles con el modelo campeon" 2>/dev/null || true
          body=$(cat <<EOF
          Los datos del ciclo ya no son compatibles con el modelo campeon. **La racha no se pierde**: ${FALLBACK} de ${TOTAL} targets se enviaron con el respaldo (persistencia), pero la accuracy va a caer hasta que haya un modelo nuevo.

          ### Que cambio
          ${reasons}

          ### Que hacer
          1. Revisar el cambio en la API (\`/v1/meta\`, \`/v1/stations\`, un ciclo de \`/v1/forecast-cycles/current\`).
          2. Adaptar las features o el protocolo del modelo a los datos nuevos y entrenar un modelo nuevo solo con el regimen nuevo.
          3. Promoverlo con \`retrain-on-wape-drift\` (force_candidate) cuando le gane al respaldo.

          Este issue se cierra solo cuando un ciclo vuelve a usar el campeon en todos los targets.
          Run: $RUN_URL
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" \
            --title "Datos incompatibles con el modelo: crear un modelo nuevo" --body "$body"

      - name: Upload generated submission artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-submission
          path: |
            artifacts/current_submission.json
            artifacts/compatibility_report.json
          if-no-files-found: ignore
