name: retrain-on-wape-drift

on:
  # El profesor cambia el patron por estacion en cuestion de dias: un candidato cada 6 h
  # sigue el regimen actual. La compuerta emparejada decide si reemplaza al campeon.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_candidate:
        description: Train a candidate from persisted Supabase data without requiring a pending WAPE alert
        type: boolean
        required: false
        default: false

concurrency:
  group: pulso-model-retrain
  cancel-in-progress: false

jobs:
  evaluate-and-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Permite recuperar el ultimo paquete promoted cuando el cache del runner llega vacio.
      actions: read
    env:
      PULSO_API_URL: ${{ vars.PULSO_API_URL || 'https://pulso-transmi.72-60-245-2.sslip.io' }}
      PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://jwlgxabibcticikhjhzf.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Los runs programados siempre entrenan un candidato; los manuales, si se marca la casilla.
      FORCE_CANDIDATE: ${{ github.event_name == 'schedule' || inputs.force_candidate == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[ml]'
      - name: Find pending WAPE drift alert
        id: pending
        run: python scripts/wape_drift.py pending
      - name: Restore current model package
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/pulso_transmi_best_models
            artifacts/pulso_transmi_best_models.zip
          key: pulso-transmi-model-gap133-${{ github.run_id }}
          restore-keys: |
            pulso-transmi-model-gap133-
            pulso-transmi-model-
      - name: Recover champion package from the last successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle=artifacts/pulso_transmi_best_models
          complete=true
          [[ -f "$bundle/best_ensemble_summary.csv" ]] || complete=false
          for horizon in 15 30 45 60; do
            [[ -f "$bundle/models/horizon_${horizon}_hgb.pkl" ]] || complete=false
            [[ -f "$bundle/configs/horizon_${horizon}_ensemble.json" ]] || complete=false
          done
          if [[ "$complete" == true ]]; then
            echo "Champion recuperado del cache; no hace falta el artefacto."
            exit 0
          fi
          run_id=$(gh run list --workflow retrain_on_drift.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "No hay ningun run previo del que recuperar el champion: este run tendria que arrancar el primer modelo."
            exit 0
          fi
          if gh run download "$run_id" -n champion-package --dir artifacts; then
            echo "Champion recuperado del artefacto del run $run_id (el cache del runner llegaba vacio)."
          else
            echo "El run $run_id no dejo el artefacto champion-package: no habra comparacion emparejada."
          fi
      - name: Check restored package
        id: model_state
        run: |
          bundle=artifacts/pulso_transmi_best_models
          available=true
          [[ -f "$bundle/best_ensemble_summary.csv" ]] || available=false
          for horizon in 15 30 45 60; do
            [[ -f "$bundle/models/horizon_${horizon}_hgb.pkl" ]] || available=false
            [[ -f "$bundle/configs/horizon_${horizon}_ensemble.json" ]] || available=false
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"
          # Sin campeon no hay nada que emparejar: la unica promocion posible es arrancar.
          if [[ "$available" == true ]]; then
            echo "first_model=false" >> "$GITHUB_OUTPUT"
          else
            echo "first_model=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Require current champion for a manual candidate run
        if: env.FORCE_CANDIDATE == 'true' && steps.model_state.outputs.available != 'true'
        run: |
          echo "No se encontró el champion actual; se cancela para evitar activar un candidato sin comparación." >&2
          exit 1
      - name: Download current collected data from Supabase
        if: steps.pending.outputs.drift_pending == 'true' || env.FORCE_CANDIDATE == 'true'
        run: python scripts/download_supabase_data.py
      - name: Preserve prior package
        if: (steps.pending.outputs.drift_pending == 'true' || env.FORCE_CANDIDATE == 'true') && steps.model_state.outputs.available == 'true'
        run: |
          cp -a artifacts/pulso_transmi_best_models artifacts/previous_model
          if [[ -f artifacts/pulso_transmi_best_models.zip ]]; then cp artifacts/pulso_transmi_best_models.zip artifacts/previous_model.zip; fi
      - name: Train candidate using temporal validation accuracy
        id: train
        if: steps.pending.outputs.drift_pending == 'true' || env.FORCE_CANDIDATE == 'true'
        run: |
          champion_args=()
          if [[ "${{ steps.model_state.outputs.available }}" == 'true' ]]; then
            champion_args+=(--score-champion artifacts/previous_model)
            champion_version=$(python -c "import json,pathlib,sys; print(json.loads(pathlib.Path(sys.argv[1]).read_text()).get('model_version') or '')" artifacts/previous_model/manifest.json 2>/dev/null || true)
            if [[ -n "$champion_version" ]]; then
              champion_args+=(--champion-version "$champion_version")
            fi
          fi
          echo "El candidato se evalua en la misma ventana y folds que el champion: ${champion_args[*]:-sin champion}"
          MLFLOW_DISABLE_AGENT_HINT=1 PYTHONWARNINGS=ignore PYTHONPATH=src python examples/03_gradient_boosting.py "${champion_args[@]}"
          MLFLOW_DISABLE_AGENT_HINT=1 PYTHONWARNINGS=ignore PYTHONPATH=src python examples/04_package_best_model.py \
            --previous-model artifacts/previous_model
      - name: Promote candidate only if validation accuracy improves
        id: promote
        if: steps.train.outcome == 'success'
        run: |
          previous_args=()
          if [[ -n "$(ls -A artifacts/previous_model 2>/dev/null)" ]]; then
            previous_args+=(--previous artifacts/previous_model)
          else
            # Sin esta bandera, cuando el cache llega vacio la compuerta se salta y el
            # campeon de produccion se queda obsoleto para siempre sin nadie que avise.
            echo "::warning::No hay paquete previo que emparejar; se intenta el arranque del primer campeon."
            previous_args+=(--first-model)
          fi
          PYTHONPATH=src python scripts/promote_model.py \
            --candidate artifacts/pulso_transmi_best_models \
            "${previous_args[@]}" \
            --package artifacts/pulso_transmi_best_models \
            --package-zip artifacts/pulso_transmi_best_models.zip \
            --output artifacts/model_promotion.json
      - name: Save promoted model package
        if: steps.promote.outcome == 'success' && (steps.model_state.outputs.available == 'true' || steps.promote.outputs.promoted == 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/pulso_transmi_best_models
            artifacts/pulso_transmi_best_models.zip
          key: pulso-transmi-model-gap133-${{ github.run_id }}
      - name: Publish the champion package for the next run
        if: steps.model_state.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: champion-package
          path: artifacts/pulso_transmi_best_models
          retention-days: 90
          if-no-files-found: error
      - name: Mark drift alert processed
        if: steps.train.outcome == 'success' && steps.pending.outputs.drift_pending == 'true'
        env:
          PROMOTED: ${{ steps.promote.outputs.promoted }}
          REASON: ${{ steps.promote.outputs.reason }}
          DRIFT_CHECK_ID: ${{ steps.pending.outputs.drift_check_id }}
        run: |
          # La alerta solo se cierra cuando hubo veredicto medible. Un candidato que no
          # se pudo emparejar (champion no recuperado, ventana distinta, metricas
          # ausentes) deja la alerta viva para reintentarla en el siguiente ciclo.
          case "$REASON" in
            paired_improvement|paired_refresh|first_model|no_improvement|horizon_regression|station_regression)
              python scripts/wape_drift.py mark --id "$DRIFT_CHECK_ID"
              echo "Alerta WAPE cerrada tras veredicto: $REASON (promovido=$PROMOTED)."
              ;;
            *)
              echo "::warning::La alerta WAPE sigue pendiente: el candidato no dio un veredicto valido (reason=${REASON:-sin paso de promocion})."
              ;;
          esac
      - name: Report outcome
        if: always()
        env:
          DRIFT_PENDING: ${{ steps.pending.outputs.drift_pending }}
          TRAIN_OUTCOME: ${{ steps.train.outcome }}
          DRIFT_CHECK_ID: ${{ steps.pending.outputs.drift_check_id }}
          PROMOTED: ${{ steps.promote.outputs.promoted }}
          PROMOTION_REASON: ${{ steps.promote.outputs.reason }}
        run: |
          if [[ -n "${PROMOTION_REASON:-}" ]]; then
            echo "Decision de promocion: $PROMOTION_REASON (promovido=${PROMOTED:-no}). Los horizontes conservados del campeon quedan en artifacts/model_promotion.json." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$DRIFT_PENDING" != "true" ]]; then
            if [[ "$FORCE_CANDIDATE" == "true" && "$TRAIN_OUTCOME" == "success" ]]; then
              echo "Candidato manual entrenado y evaluado contra el champion; solo se guarda si supera la compuerta de calidad." >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$FORCE_CANDIDATE" == "true" ]]; then
              echo "El entrenamiento manual del candidato no terminó; el champion se conserva." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Sin alertas WAPE pendientes; no se reentrenó." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$TRAIN_OUTCOME" == "success" ]]; then
            echo "Candidato entrenado y evaluado. Alerta WAPE procesada: $DRIFT_CHECK_ID." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "La alerta $DRIFT_CHECK_ID sigue pendiente porque el reentrenamiento no terminó correctamente." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wape-retraining-report
          path: |
            reports/ml_validation_metrics.csv
            reports/validation_window.json
            artifacts/model_promotion.json
            artifacts/pulso_transmi_best_models/promotion_inputs.json
          if-no-files-found: ignore
