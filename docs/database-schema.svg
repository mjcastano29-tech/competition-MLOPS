<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
  <title id="title">Esquema entidad-relacion ampliado de Pulso TransMi</title>
  <desc id="desc">Diez tablas para datos, features, modelos, ejecuciones, predicciones, metricas y drift.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>.entity{fill:#fff;stroke:#1e3a5f;stroke-width:2}.header{fill:#1e3a5f}.ht{fill:#fff;font:700 18px sans-serif}.field{fill:#172033;font:14px monospace}.label{fill:#475569;font:12px sans-serif}.rel{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.title{fill:#0f172a;font:700 28px sans-serif}.sub{fill:#475569;font:16px sans-serif}</style>
  </defs>
  <rect width="1800" height="1250" fill="#f8fafc"/>
  <text x="900" y="42" text-anchor="middle" class="title">Pulso TransMi - esquema entidad-relacion ampliado</text>
  <text x="900" y="70" text-anchor="middle" class="sub">Datos reproducibles, features, modelos, ejecuciones, predicciones y monitoreo</text>

  <path class="rel" d="M275 230C420 230 530 300 680 300"/><text x="430" y="235" class="label">1:N</text>
  <path class="rel" d="M660 230H680"/><text x="665" y="215" class="label">1:N</text>
  <path class="rel" d="M275 540C600 540 800 570 1100 570"/><text x="600" y="525" class="label">1:N</text>
  <path class="rel" d="M660 540H785"/><text x="715" y="525" class="label">1:N</text>
  <path class="rel" d="M660 540H785"/><text x="715" y="525" class="label">1:N</text>
  <path class="rel" d="M1065 230V365"/><text x="1080" y="305" class="label">1:N</text>
  <path class="rel" d="M1065 540V675"/><text x="1080" y="615" class="label">1:N</text>
  <path class="rel" d="M1325 540H1430"/><text x="1375" y="525" class="label">1:N</text>
  <path class="rel" d="M1325 540C1390 650 1440 760 1510 850"/><text x="1380" y="700" class="label">1:N</text>
  <path class="rel" d="M925 650V790"/><text x="945" y="730" class="label">1:N</text>
  <path class="rel" d="M275 540C470 700 610 820 785 850"/><text x="520" y="735" class="label">1:N opcional</text>

  <g transform="translate(45 120)"><rect class="entity" width="230" height="220" rx="8"/><rect class="header" width="230" height="40" rx="8"/><rect class="header" y="32" width="230" height="8"/><text x="115" y="27" text-anchor="middle" class="ht">STATIONS</text><text x="14" y="70" class="field">PK station_id text</text><text x="14" y="98" class="field">station_name text</text><text x="14" y="126" class="field">corridor text</text><text x="14" y="154" class="field">latitude numeric</text><text x="14" y="182" class="field">longitude numeric</text><text x="14" y="210" class="field">active boolean</text></g>
  <g transform="translate(380 120)"><rect class="entity" width="280" height="220" rx="8"/><rect class="header" width="280" height="40" rx="8"/><rect class="header" y="32" width="280" height="8"/><text x="140" y="27" text-anchor="middle" class="ht">DATASETS</text><text x="14" y="70" class="field">PK dataset_id uuid</text><text x="14" y="98" class="field">dataset_name text</text><text x="14" y="126" class="field">source_url text</text><text x="14" y="154" class="field">api_version text</text><text x="14" y="182" class="field">content_hash text</text><text x="14" y="210" class="field">cutoff_at / ingested_at</text></g>
  <g transform="translate(680 120)"><rect class="entity" width="385" height="220" rx="8"/><rect class="header" width="385" height="40" rx="8"/><rect class="header" y="32" width="385" height="8"/><text x="192" y="27" text-anchor="middle" class="ht">OBSERVATIONS</text><text x="14" y="70" class="field">PK observation_id bigint</text><text x="14" y="98" class="field">FK dataset_id / station_id</text><text x="14" y="126" class="field">observed_at timestamptz</text><text x="14" y="154" class="field">demand integer</text><text x="14" y="182" class="field">ingested_at timestamptz</text><text x="14" y="210" class="label">UNIQUE station_id + observed_at</text></g>
  <g transform="translate(1100 120)"><rect class="entity" width="350" height="220" rx="8"/><rect class="header" width="350" height="40" rx="8"/><rect class="header" y="32" width="350" height="8"/><text x="175" y="27" text-anchor="middle" class="ht">CONTEXT</text><text x="14" y="70" class="field">PK observed_at timestamptz</text><text x="14" y="98" class="field">FK dataset_id uuid</text><text x="14" y="126" class="field">rain_mm / rain_forecast</text><text x="14" y="154" class="field">temperature_c / forecast</text><text x="14" y="182" class="field">event_intensity numeric</text><text x="14" y="210" class="label">Una fila por periodo temporal</text></g>
  <g transform="translate(45 430)"><rect class="entity" width="230" height="220" rx="8"/><rect class="header" width="230" height="40" rx="8"/><rect class="header" y="32" width="230" height="8"/><text x="115" y="27" text-anchor="middle" class="ht">FEATURE_SNAPSHOTS</text><text x="14" y="70" class="field">PK feature_snapshot_id</text><text x="14" y="98" class="field">FK dataset_id uuid</text><text x="14" y="126" class="field">version text</text><text x="14" y="154" class="field">feature_config jsonb</text><text x="14" y="182" class="field">artifact_uri text</text><text x="14" y="210" class="field">created_at timestamptz</text></g>
  <g transform="translate(380 430)"><rect class="entity" width="280" height="220" rx="8"/><rect class="header" width="280" height="40" rx="8"/><rect class="header" y="32" width="280" height="8"/><text x="140" y="27" text-anchor="middle" class="ht">MODEL_VERSIONS</text><text x="14" y="70" class="field">PK model_version_id</text><text x="14" y="98" class="field">FK feature_snapshot_id</text><text x="14" y="126" class="field">version / git_commit</text><text x="14" y="154" class="field">training_cutoff</text><text x="14" y="182" class="field">feature_config jsonb</text><text x="14" y="210" class="field">status / created_at</text></g>
  <g transform="translate(785 430)"><rect class="entity" width="280" height="220" rx="8"/><rect class="header" width="280" height="40" rx="8"/><rect class="header" y="32" width="280" height="8"/><text x="140" y="27" text-anchor="middle" class="ht">PIPELINE_RUNS</text><text x="14" y="70" class="field">PK run_id uuid</text><text x="14" y="98" class="field">FK model_version_id</text><text x="14" y="126" class="field">started_at / finished_at</text><text x="14" y="154" class="field">data_cutoff timestamptz</text><text x="14" y="182" class="field">status text</text><text x="14" y="210" class="field">error_message text</text></g>
  <g transform="translate(1100 430)"><rect class="entity" width="350" height="220" rx="8"/><rect class="header" width="350" height="40" rx="8"/><rect class="header" y="32" width="350" height="8"/><text x="175" y="27" text-anchor="middle" class="ht">PREDICTIONS</text><text x="14" y="70" class="field">PK prediction_id bigint</text><text x="14" y="98" class="field">FK run_id / station_id</text><text x="14" y="126" class="field">target_at timestamptz</text><text x="14" y="154" class="field">horizon_minutes integer</text><text x="14" y="182" class="field">predicted_demand numeric</text><text x="14" y="210" class="field">created_at timestamptz</text></g>
  <g transform="translate(1430 430)"><rect class="entity" width="310" height="220" rx="8"/><rect class="header" width="310" height="40" rx="8"/><rect class="header" y="32" width="310" height="8"/><text x="155" y="27" text-anchor="middle" class="ht">DRIFT_EVENTS</text><text x="14" y="70" class="field">PK drift_event_id bigint</text><text x="14" y="98" class="field">FK run_id uuid</text><text x="14" y="126" class="field">metric_name text</text><text x="14" y="154" class="field">observed_value / threshold</text><text x="14" y="182" class="field">severity text</text><text x="14" y="210" class="field">detected_at timestamptz</text></g>
  <g transform="translate(785 790)"><rect class="entity" width="280" height="220" rx="8"/><rect class="header" width="280" height="40" rx="8"/><rect class="header" y="32" width="280" height="8"/><text x="140" y="27" text-anchor="middle" class="ht">METRICS</text><text x="14" y="70" class="field">PK metric_id bigint</text><text x="14" y="98" class="field">FK run_id uuid</text><text x="14" y="126" class="field">FK station_id nullable</text><text x="14" y="154" class="field">metric_name text</text><text x="14" y="182" class="field">metric_value numeric</text><text x="14" y="210" class="field">window_start / end</text></g>
  <text x="900" y="1080" text-anchor="middle" class="sub">Restricciones: unique(station_id, observed_at) y unique(run_id, station_id, target_at, horizon_minutes)</text>
</svg>
